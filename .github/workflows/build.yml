name: Build & Release Single-File Executable

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 9 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore AMDAutoTuning/AMDAutoTuning.csproj

    - name: Publish Single-File Executable (Standalone)
      run: |
        dotnet publish AMDAutoTuning/AMDAutoTuning.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./publish

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AMDAutoTuning-Standalone-win-x64
        path: ./publish/AMDAutoTuning.exe

    - name: Create Release on Tag
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: ./publish/AMDAutoTuning.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
